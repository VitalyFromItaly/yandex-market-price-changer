<!--
  Иконка панели журнала: три строки-записи на плашке акцентного цвета (#2563eb —
  тот же, что у кнопок в styles.css).

  SVG, а не .ico, по той же причине, по которой панель собирается, а не тянет Vue
  с CDN: это один текстовый файл в бандле, без бинарника в репозитории и без
  единого внешнего запроса. Форма намеренно грубая — на 16px различимы только
  плашка и полоски, детали превратились бы в кашу.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#2563eb" />
  <g fill="#ffffff">
    <rect x="8" y="10" width="16" height="3" rx="1.5" />
    <rect x="8" y="15" width="16" height="3" rx="1.5" />
    <rect x="8" y="20" width="10" height="3" rx="1.5" />
  </g>
</svg>
