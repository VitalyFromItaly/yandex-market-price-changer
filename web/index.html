<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Панель закрыта токеном, но индексировать её незачем в любом случае. -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Явный link нужен не только ради самой иконки: без него браузер сам просит
      /favicon.ico, а статика Nest такого файла не отдаёт — в логах это выглядело
      как «Cannot GET /favicon.ico» на каждое открытие панели.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Журнал действий</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
