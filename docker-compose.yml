services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Имена ниже должны в точности совпадать с тем, что читает код.
      # Раньше здесь были MONGODB_URI и REDIS_URL, которых код не знает:
      # Mongoose получал undefined, а Bull молча уходил на localhost:6379.
      - PORT=3000
      - MONGODB_URL=mongodb://root:secret@mongodb:27017/
      - MONGODB_DATABASE=${MONGODB_DATABASE:-yandex-market-price-changer}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # REDIS_PASSWORD намеренно не задан: redis ниже поднимается без пароля,
      # а переданный пароль заставляет сервер писать предупреждение на каждое
      # соединение. Если включите auth — добавьте и сюда, и в команду redis.
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:?нужно задать TELEGRAM_TOKEN в .env}
      # webhook (по умолчанию) или polling. Polling нужен там, откуда вебхук
      # недостижим для Telegram, — см. комментарий в env.validation.ts.
      - TELEGRAM_UPDATE_MODE=${TELEGRAM_UPDATE_MODE:-webhook}
      # Без `:?`: при polling переменная не нужна, и обязательность проверяет
      # Joi — уже с учётом режима, чего compose сделать не может.
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL:-}
      # Зеркало Bot API. Без значения — ходим на api.telegram.org напрямую.
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-https://api.telegram.org}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS:?нужно задать TELEGRAM_ADMIN_IDS в .env}
      - YANDEX_MARKET_BASE_URL=${YANDEX_MARKET_BASE_URL:-https://api.partner.market.yandex.ru}
    depends_on:
      - mongodb
      - redis
    networks:
      - net
    volumes:
      - "./static:/app/static"

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - "./volumes/common/mongodb_data:/data/db"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    networks:
      - net

  mongo-express:
    image: mongo-express
    restart: unless-stopped
    networks:
      - net
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://root:secret@mongodb:27017/
    depends_on:
      - mongodb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - "./volumes/common/redis_data:/data"
    command: redis-server --appendonly yes
    networks:
      - net

networks:
  net:
    driver: bridge
