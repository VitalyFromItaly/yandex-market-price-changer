name: Node.js CI

# Не только push: без pull_request проверка не успевает сработать до слияния,
# то есть приходит уже к тому, что исправлять поздно.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - run: npm ci --no-audit

      # --if-present снят намеренно. Он молча пропускает шаг, если скрипта нет,
      # — именно так CI и оставался зелёным при отсутствующем prettier:check и
      # при 374 тестах, которые никто не запускал. Отсутствие проверки должно
      # ломать сборку, а не выглядеть как пройденная проверка.
      - name: Типы
        run: npm run typecheck

      - name: Линт
        run: npm run lint

      - name: Форматирование
        run: npm run prettier:check

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build
