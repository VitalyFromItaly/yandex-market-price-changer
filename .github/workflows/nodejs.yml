name: Node.js CI

# Не только push: без pull_request проверка не успевает сработать до слияния,
# то есть приходит уже к тому, что исправлять поздно.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Настоящий Postgres для финансов (решение finance_postgres_tests): локально
    # тесты репозиториев идут на PGlite, здесь — ещё раз на сервере, где есть
    # то, чего PGlite не умеет: гонки двух соединений.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgres://finance:secret@localhost:5432/finance

    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - run: npm ci --no-audit

      # --if-present снят намеренно. Он молча пропускает шаг, если скрипта нет,
      # — именно так CI и оставался зелёным при отсутствующем prettier:check и
      # при 374 тестах, которые никто не запускал. Отсутствие проверки должно
      # ломать сборку, а не выглядеть как пройденная проверка.
      - name: Типы
        run: npm run typecheck

      - name: Типы CRM
        run: npm run typecheck:crm

      - name: Линт
        run: npm run lint

      - name: Форматирование
        run: npm run prettier:check

      # Те же миграции, что приложение применяет при старте: сломанная миграция
      # должна ронять CI, а не первый деплой.
      - name: Миграции Postgres
        run: npm run db:pg:migrate
        env:
          POSTGRES_URL: postgres://finance:secret@localhost:5432/finance

      - name: Тесты
        run: npm test

      - name: Тесты CRM
        run: npm run test:crm

      - name: Сборка
        run: npm run build
