name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: '22.12.0'
  DOCKER_IMAGE: yandex-market-price-changer
  CONTAINER_NAME: yandex-market-app

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: volta-cli/action@v4
      
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
          
    - name: Install dependencies
      run: npm ci --no-audit
      
    - name: Run linter
      run: npm run lint
      
    - name: Check prettier formatting
      run: npm run prettier:check --if-present
      
    - name: Run tests
      run: npm test --if-present
      
    - name: Build application
      run: npm run build

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub (optional)
      if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }}:latest .
        docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        
    - name: Push to Docker Hub (optional)
      if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
      run: |
        docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
        docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}

    # Deploy to CapRover (if using CapRover)
    - name: Deploy to CapRover
      if: ${{ secrets.CAPROVER_SERVER && secrets.CAPROVER_APP_TOKEN }}
      run: |
        npx caprover deploy \
          --caproverUrl ${{ secrets.CAPROVER_SERVER }} \
          --appToken ${{ secrets.CAPROVER_APP_TOKEN }} \
          --appName ${{ secrets.CAPROVER_APP_NAME || 'yandex-market-bot' }}

    # Alternative: Deploy via SSH (if using VPS)
    - name: Deploy via SSH
      if: ${{ secrets.SSH_HOST && secrets.SSH_USER && secrets.SSH_PRIVATE_KEY }}
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd /path/to/your/app
          git pull origin main
          docker-compose down
          docker-compose build --no-cache
          docker-compose up -d
          docker system prune -f

  notify:
    name: Notify Deployment Status
    needs: [test, build-and-deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.build-and-deploy.result == 'success' }}
      run: echo "✅ Deployment successful!"
      
    - name: Notify failure
      if: ${{ needs.build-and-deploy.result == 'failure' }}
      run: echo "❌ Deployment failed!"

    # Optional: Send notification to Telegram
    - name: Send Telegram notification
      if: ${{ secrets.TELEGRAM_BOT_TOKEN && secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
          MESSAGE="✅ Yandex Market Price Changer deployed successfully!"
        else
          MESSAGE="❌ Yandex Market Price Changer deployment failed!"
        fi
        
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=$MESSAGE" \
          -d "parse_mode=HTML" 